<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="copyright" content="© 2025–2026 GraphTheory. Licensed CC BY-NC-ND 4.0.">
<title>GRAPH QUEST — Teacher dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f7; --card:#fff; --ink:#17130c; --ink-soft:#57514a; --ink-faint:#8d867e; --line:#eae4e1;
    --orange:#ee6c34; --orange-soft:#fdeee7; --blue:#7ca3f9; --blue-soft:#eaf0fe;
    --green:#a2dd70; --green-soft:#eef8e6; --yellow:#ffd54a; --yellow-soft:#fff7e0;
    --terra:#df876e; --terra-soft:#fdeae5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 "DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 22px 90px;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;letter-spacing:-0.02em;line-height:1.1;margin:0;}
  h1{font-size:38px;font-weight:800;margin-bottom:10px;}
  h2{font-size:25px;font-weight:800;margin:0 0 6px;}
  h3{font-size:17px;font-weight:700;}
  .script{font-family:"Caveat",cursive;font-weight:700;color:var(--orange);font-size:1.3em;display:inline-block;transform:rotate(-2deg);line-height:.9;}
  p{margin:0 0 12px;color:var(--ink-soft);}
  .muted{color:var(--ink-faint);font-size:13px;}
  b.ink{color:var(--ink);}
  .kicker{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;}
  .hidden{display:none !important;}

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;}
  .brand{font-family:"Fraunces",serif;font-weight:900;font-size:18px;text-decoration:none;color:var(--ink);}
  .brand i{font-style:normal;color:var(--orange);}
  .toplinks{display:flex;gap:8px;align-items:center;}
  .tlink{font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border:2px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink-soft);cursor:pointer;text-decoration:none;white-space:nowrap;}
  .tlink:hover{border-color:var(--orange);color:var(--orange);}

  .band{margin:40px 0 16px;padding-bottom:10px;border-bottom:2px dashed var(--line);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 2px 0 rgba(23,19,12,.04),0 12px 32px -18px rgba(23,19,12,.28);}

  .btn{appearance:none;border:2px solid var(--ink);border-radius:12px;padding:11px 20px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
    background:var(--orange);color:var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;}
  .btn:hover{background:#f4854f;}
  .btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
  .btn.ghost{background:#fff;} .btn.ghost:hover{background:#fdf6f2;}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:10px;}
  .btn[disabled]{background:#e8e3df;color:#7a736c;border-color:#cfc8c3;box-shadow:0 3px 0 #cfc8c3;cursor:not-allowed;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .spread{justify-content:space-between;}

  label.fld{display:block;font-size:13.5px;font-weight:700;margin:0 0 6px;}
  input[type=text],input[type=password],select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--orange);}
  .fields{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:16px 0 10px;}
  .file{display:inline-block;position:relative;overflow:hidden;}
  .file input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .connect{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;}
  .or{border:2px dashed var(--line);border-radius:16px;padding:18px;background:var(--bg);}
  .err{background:var(--terra-soft);border:2px solid var(--terra);padding:12px 15px;border-radius:12px;font-size:14px;color:var(--ink);margin-top:12px;}

  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 6px;}
  .kpi{flex:1;min-width:150px;border:2px solid var(--ink);border-radius:14px;padding:11px 14px;background:var(--blue-soft);box-shadow:0 3px 0 var(--ink);}
  .kpi b{display:block;font-family:"Fraunces",serif;font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.15;}
  .kpi span{font-size:12px;color:var(--ink-faint);}
  .kpi:nth-child(2){background:var(--green-soft);} .kpi:nth-child(3){background:var(--yellow-soft);} .kpi:nth-child(4){background:var(--orange-soft);}

  .reteach{border:2px solid var(--ink);border-radius:18px;padding:18px 20px;background:var(--terra-soft);box-shadow:0 4px 0 var(--ink);margin-top:10px;}
  .reteach h2{margin-bottom:8px;}
  .reteach .tip{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink);margin:10px 0;}
  .also{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px;}
  .flag{border:2px solid var(--ink);border-radius:12px;padding:11px 13px;background:var(--yellow-soft);}
  .flag.hot{background:var(--terra-soft);}
  .flag b{display:block;font-size:14px;margin-bottom:2px;}
  .flag span{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}

  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid var(--ink);white-space:nowrap;display:inline-block;}
  .pill.done{background:var(--green);} .pill.part{background:var(--yellow);} .pill.alert{background:var(--terra);color:#fff;} .pill.new{background:#fff;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .m-row{padding:9px 0;border-bottom:1px solid var(--line);}
  .m-row:last-child{border-bottom:0;}
  .m-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;}
  .m-bar{height:15px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:5px 0 2px;}
  .m-bar i{display:block;height:100%;background:var(--orange);}
  .m-bar i.warn{background:var(--terra);} .m-bar i.b{background:var(--blue);}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;white-space:nowrap;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr.pick{cursor:pointer;} tr.pick:hover td{background:var(--orange-soft);}
  .low{color:#a4462a;font-weight:700;}
  .scroll{overflow-x:auto;}

  .student{border:2px solid var(--ink);border-radius:18px;padding:18px 20px;background:#fff;box-shadow:0 4px 0 var(--ink);margin-top:14px;}
  .trail{font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--ink-soft);}

  @media (max-width:760px){
    .wrap{padding:12px 14px 60px;} h1{font-size:29px;}
    .fields,.connect,.grid2{grid-template-columns:1fr;}
    .card{padding:18px 15px;}
    .kpi{min-width:0;flex:1 1 calc(50% - 12px);}
    .kpi b{font-size:22px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand" href="./">GRAPH <i>QUEST</i></a>
    <div class="toplinks">
      <a class="tlink" href="./" id="lnk-game"></a>
      <button class="tlink" id="btn-lang">BM</button>
    </div>
  </div>

  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p id="lede" style="font-size:16.5px;max-width:70ch;"></p>

  <!-- ============ CONNECT ============ -->
  <section id="connect" class="card">
    <div class="connect">
      <div>
        <h3 id="c-h1"></h3>
        <p class="muted" id="c-p1" style="margin-top:4px;"></p>
        <div class="fields">
          <div><label class="fld" for="in-url" id="lbl-url"></label><input type="text" id="in-url" spellcheck="false" autocomplete="off"></div>
          <div><label class="fld" for="in-key" id="lbl-key"></label><input type="password" id="in-key" autocomplete="off"></div>
        </div>
        <button class="btn" id="btn-load"></button>
      </div>
      <div class="or">
        <h3 id="c-h2"></h3>
        <p class="muted" id="c-p2" style="margin-top:4px;"></p>
        <span class="btn ghost file"><span id="lbl-csv"></span><input type="file" id="in-csv" accept=".csv,text/csv" multiple></span>
      </div>
    </div>
    <div id="c-err"></div>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="dash" class="hidden">
    <div class="row spread" style="margin-top:6px;">
      <div class="row" style="flex:1;min-width:260px;">
        <label class="fld" for="sel-class" id="lbl-class" style="margin:0;"></label>
        <select id="sel-class" style="max-width:260px;"></select>
      </div>
      <div class="row">
        <span class="muted" id="loaded-at"></span>
        <button class="btn ghost sm" id="btn-reload"></button>
        <button class="btn ghost sm" id="btn-disconnect"></button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div id="reteach"></div>

    <div class="band"><div class="kicker" id="k-mastery"></div><h2 id="h-mastery"></h2></div>
    <div class="grid2">
      <div class="card" id="mastery"></div>
      <div class="card" id="mistakes"></div>
    </div>

    <div class="band"><div class="kicker" id="k-levels"></div><h2 id="h-levels"></h2></div>
    <div class="card scroll" id="levels"></div>

    <div class="band"><div class="kicker" id="k-support"></div><h2 id="h-support"></h2></div>
    <div class="grid2" id="support"></div>

    <div class="band"><div class="kicker" id="k-students"></div><h2 id="h-students"></h2></div>
    <p class="muted" id="p-students"></p>
    <div class="card scroll" id="students"></div>
    <div id="student"></div>

    <div class="band"><div class="kicker" id="k-boss"></div><h2 id="h-boss"></h2></div>
    <div class="card" id="boss"></div>

    <div class="band"><div class="kicker" id="k-prepost"></div><h2 id="h-prepost"></h2></div>
    <div class="card" id="prepost"></div>
  </section>

  <p class="muted" id="privacy" style="margin-top:40px;"></p>
</div>

<script src="tests.js"></script>
<script>
/* ============================================================
   GRAPH QUEST — teacher dashboard
   Reads the Attempts sheet (one row per attempt) either through the Apps
   Script with the teacher key, or from a CSV downloaded from the Sheet.
   Everything is computed here, in the browser; nothing is sent anywhere.
   ============================================================ */
const DEFAULT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyFnia-RLg8WPjFM5ymNCpKdB8KXfhRuAJhHR1ZLEPPvBZapMygv_UjW1DvYHppjPF_/exec';
const LANG_KEY = 'graphtheory-lang', CONN_KEY = 'graphquest.teacher';

let LANG = 'en';
try { const s = localStorage.getItem(LANG_KEY); if (s === 'bm' || s === 'en') LANG = s; } catch (e) {}
const T = (en, bm) => LANG === 'bm' ? bm : en;
const tt = p => T(p[0], p[1]);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- what the game contains ---------- */
const WORLDS = {
  1: { name: ['Graph Maze', 'Labirin Graf'], levels: [['Find a way out', 'Cari jalan keluar'], ['Never twice', 'Jangan dua kali'], ['Checkpoints', 'Pusat pemeriksaan'], ['One-way trails', 'Denai sehala'], ['Any way out?', 'Ada jalan keluar?']] },
  2: { name: ['Graph Detective', 'Detektif Graf'], levels: [['Count the corridors', 'Kira koridor'], ['Follow the suspect', 'Jejak suspek'], ['Loops and twin corridors', 'Gelung dan koridor berkembar'], ['Three witnesses', 'Tiga saksi'], ['Timed case', 'Kes berpemasa']] },
  3: { name: ['Shortest Path Race', 'Perlumbaan Laluan Terpendek'], levels: [['4 towns', '4 pekan'], ['6 towns', '6 pekan'], ['Road closed!', 'Jalan ditutup!'], ['Fastest, not shortest', 'Paling pantas, bukan terpendek'], ['Random challenge', 'Cabaran rawak']] },
  4: { name: ['Build the Network', 'Bina Rangkaian'], levels: [['Connect every kampung', 'Sambung setiap kampung'], ['No wasted cable', 'Tiada kabel membazir'], ['On a budget', 'Dalam bajet'], ['Cheapest possible', 'Paling murah'], ['Random challenge', 'Cabaran rawak']] },
  5: { name: ['Euler Escape (bonus)', 'Lolos Euler (bonus)'], levels: [['Easy escape', 'Lolos mudah'], ['Start at the Tower', 'Mula di Menara'], ['The impossible city', 'Bandar mustahil'], ['Return home', 'Pulang ke rumah'], ['Random city', 'Bandar rawak']] },
  6: { name: ['Colour Master (bonus)', 'Pakar Warna (bonus)'], levels: [['A valid timetable', 'Jadual yang sah'], ['Three slots only', 'Tiga slot sahaja'], ['Fewest slots', 'Slot paling sedikit'], ['The science stream', 'Aliran sains'], ['Random timetable', 'Jadual rawak']] }
};
const WKEYS = Object.keys(WORLDS);
const BOSS_MISSIONS = [
  { name: ['Water for everyone', 'Air untuk semua'], tool: 'network' }, { name: ['Ambulance!', 'Ambulans!'], tool: 'shortest' },
  { name: ['Traffic lights', 'Lampu isyarat'], tool: 'degree' }, { name: ['The bridge is down', 'Jambatan runtuh'], tool: 'maze' }
];
const TOOL_NAMES = { maze: ['Graph Maze', 'Labirin Graf'], degree: ['Graph Detective', 'Detektif Graf'], shortest: ['Shortest Path Race', 'Perlumbaan Laluan Terpendek'], network: ['Build the Network', 'Bina Rangkaian'] };
const RANKS = [['Novice', 'Pemula'], ['Graph Explorer', 'Penjelajah Graf'], ['Path Finder', 'Pencari Laluan'], ['Network Builder', 'Pembina Rangkaian'], ['Graph Master', 'Pakar Graf'], ['Graph Legend', 'Lagenda Graf']];

/* Each mistake tag: what it means, and a one-line idea for tomorrow's lesson. */
const TAGS = {
  fewest_edges_not_shortest: { l: ['Chose fewest roads, not shortest distance', 'Pilih jalan paling sedikit, bukan jarak terpendek'],
    tip: ['Put two routes side by side on the board — one with fewer roads, one with a smaller total. Add both up aloud.', 'Letak dua laluan bersebelahan di papan — satu dengan jalan lebih sedikit, satu dengan jumlah lebih kecil. Jumlahkan kedua-duanya dengan kuat.'] },
  chose_distance_not_time: { l: ['Used km when the mission was time', 'Guna km sedangkan misinya masa'],
    tip: ['Same map, two questions: "shortest?" then "fastest?". Show that the weight you add depends on the question.', 'Peta yang sama, dua soalan: "terpendek?" kemudian "paling pantas?". Tunjukkan pemberat yang dijumlahkan bergantung pada soalan.'] },
  valid_not_optimal: { l: ['Valid route, not the shortest', 'Laluan sah, bukan terpendek'],
    tip: ['Ask students to list every route and its total before choosing — then compare totals, not single roads.', 'Minta murid senaraikan setiap laluan dan jumlahnya sebelum memilih — bandingkan jumlah, bukan satu-satu jalan.'] },
  miscounted_degree: { l: ['Miscounted a degree', 'Salah kira darjah'],
    tip: ['Have students tick each edge as they count it at a vertex, so no edge is missed or counted twice.', 'Minta murid tandakan setiap sisi semasa mengira di sesuatu bucu, supaya tiada sisi tertinggal atau dikira dua kali.'] },
  loop_counted_once: { l: ['Counted a loop as 1, not 2', 'Kira gelung sebagai 1, bukan 2'],
    tip: ['Draw a loop and mark both of its ends touching the vertex. Two ends, so it adds 2 to the degree.', 'Lukis gelung dan tandakan kedua-dua hujungnya yang menyentuh bucu. Dua hujung, jadi ia menambah 2 pada darjah.'] },
  multiple_edge_counted_once: { l: ['Counted multiple edges as one', 'Kira sisi berbilang sebagai satu'],
    tip: ['Show two separate corridors between the same two rooms: each is its own edge and each adds 1.', 'Tunjukkan dua koridor berasingan antara dua bilik yang sama: setiap satu ialah sisi tersendiri dan menambah 1.'] },
  wrong_vertex_for_degree: { l: ['Picked a place with the wrong degree', 'Pilih tempat dengan darjah yang salah'],
    tip: ['Before searching, write the degree next to every vertex. Then the question becomes a lookup.', 'Sebelum mencari, tulis darjah di sebelah setiap bucu. Kemudian soalan menjadi semakan mudah.'] },
  missed_loop: { l: ['Could not find the loop', 'Tidak jumpa gelung'],
    tip: ['Contrast a loop (one vertex) with an ordinary edge (two different vertices) on the same diagram.', 'Bandingkan gelung (satu bucu) dengan sisi biasa (dua bucu berbeza) dalam gambar rajah yang sama.'] },
  missed_multiple_edge: { l: ['Could not find the multiple edges', 'Tidak jumpa sisi berbilang'],
    tip: ['Ask: which pair of vertices is joined more than once? Then define a simple graph as one where the answer is "none".', 'Tanya: pasangan bucu manakah yang dihubungkan lebih daripada sekali? Kemudian takrifkan graf mudah sebagai graf yang jawapannya "tiada".'] },
  repeated_vertex: { l: ['Passed the same place twice in a path', 'Melalui tempat yang sama dua kali dalam lorong'],
    tip: ['Contrast a walk (repeats allowed) with a path (no vertex twice): trace both on one map.', 'Bandingkan jalan (boleh berulang) dengan lorong (tiada bucu berulang): lukis kedua-duanya pada satu peta.'] },
  missed_checkpoint: { l: ['Reached the end but missed a checkpoint', 'Sampai ke hujung tetapi terlepas pusat pemeriksaan'],
    tip: ['Plan backwards from the checkpoints: which order lets one path visit them all?', 'Rancang dari pusat pemeriksaan: susunan mana yang membolehkan satu lorong melawat semuanya?'] },
  against_direction: { l: ['Went against a one-way edge', 'Melawan arah sisi sehala'],
    tip: ['In a directed graph, read each arrow aloud as "from … to …" before moving.', 'Dalam graf terarah, baca setiap anak panah sebagai "dari … ke …" sebelum bergerak.'] },
  said_no_way_but_connected: { l: ['Said "no way" when a path existed', 'Kata "tiada jalan" sedangkan lorong wujud'],
    tip: ['Before deciding a graph isn’t connected, colour everything reachable from the start.', 'Sebelum memutuskan graf tidak tersambung, warnakan semua yang boleh dicapai dari titik mula.'] },
  cycle_created: { l: ['Left a cycle in the network', 'Meninggalkan kitaran dalam rangkaian'],
    tip: ['Every cable in a cycle can be removed without cutting anyone off. A tree has none.', 'Setiap kabel dalam kitaran boleh dibuang tanpa memutuskan sesiapa. Pokok tiada kitaran.'] },
  over_budget: { l: ['Went over the budget', 'Melebihi bajet'],
    tip: ['Compare two trees on the same map: same number of edges, different totals.', 'Bandingkan dua pokok pada peta yang sama: bilangan sisi sama, jumlah berbeza.'] },
  not_minimum: { l: ['A tree, but not the cheapest', 'Pokok, tetapi bukan paling murah'],
    tip: ['Model Kruskal’s method: list edges cheapest first, take each unless it closes a cycle.', 'Tunjukkan kaedah Kruskal: senaraikan sisi paling murah dahulu, ambil setiap satu kecuali ia menutup kitaran.'] },
  not_fastest: { l: ['A route, but not the fastest', 'Laluan, tetapi bukan paling pantas'],
    tip: ['Total each route before choosing; the most direct-looking one is often not the fastest.', 'Jumlahkan setiap laluan sebelum memilih; yang nampak paling terus selalunya bukan paling pantas.'] },
  wrong_prediction: { l: ['Predicted wrongly whether an Euler trail exists', 'Salah meramal sama ada surih Euler wujud'],
    tip: ['Before trying, count the odd vertices: 0 or 2 means yes, more means no.', 'Sebelum mencuba, kira bucu ganjil: 0 atau 2 bermakna ya, lebih bermakna tidak.'] },
  stuck_trail: { l: ['Got stuck with bridges left', 'Tersekat dengan jambatan berbaki'],
    tip: ['When exactly two vertices are odd, the trail must start at one and end at the other.', 'Apabila tepat dua bucu ganjil, surih mesti bermula di satu dan berakhir di satu lagi.'] },
  wrong_odd_tap: { l: ['Called an even vertex odd', 'Menyebut bucu genap sebagai ganjil'],
    tip: ['Tick each edge at a vertex as you count; write the degree beside it before judging odd or even.', 'Tanda setiap sisi di bucu semasa mengira; tulis darjah di sebelahnya sebelum menilai ganjil atau genap.'] },
  said_impossible_but_possible: { l: ['Said "impossible" when an Euler trail existed', 'Kata "mustahil" sedangkan surih Euler wujud'],
    tip: ['Show that a failed attempt proves nothing — the start vertex matters. Count odd vertices instead.', 'Tunjukkan cubaan gagal tidak membuktikan apa-apa — bucu mula penting. Kira bucu ganjil.'] },
  clash: { l: ['Put two clashing subjects in one slot', 'Letak dua subjek bertembung dalam satu slot'],
    tip: ['An edge means "different colours". Check each edge once the colouring is done.', 'Sisi bermaksud "warna berbeza". Semak setiap sisi selepas mewarna.'] },
  too_many_slots: { l: ['Used more slots than allowed', 'Guna lebih slot daripada dibenarkan'],
    tip: ['Colour the vertex with the highest degree first, then reuse the lowest colour that fits.', 'Warnakan bucu berdarjah tertinggi dahulu, kemudian guna semula warna terendah yang sesuai.'] },
  not_fewest: { l: ['Valid colouring, but not the fewest colours', 'Pewarnaan sah, tetapi bukan warna paling sedikit'],
    tip: ['Find the largest group that all clash: that is the lower bound. Then try to meet it.', 'Cari kumpulan terbesar yang semuanya bertembung: itulah batas bawah. Kemudian cuba capainya.'] },
  clue_ignored: { l: ['Ignored one of the clues', 'Abaikan salah satu petunjuk'],
    tip: ['Model it as elimination: cross out places that fail clue 1, then clue 2, then clue 3.', 'Tunjukkan sebagai penyingkiran: potong tempat yang gagal petunjuk 1, kemudian 2, kemudian 3.'] }
};
const tagLabel = t => TAGS[t] ? tt(TAGS[t].l) : t;

/* ============================================================
   Loading
   ============================================================ */
let ALL = [], TESTS = [], PRE = null, source = null, loadedAt = null, current = null, openStudent = null;

function conn() { try { return JSON.parse(localStorage.getItem(CONN_KEY)) || {}; } catch (e) { return {}; } }
function saveConn(o) { try { localStorage.setItem(CONN_KEY, JSON.stringify(o)); } catch (e) {} }

function showErr(msg) { $('c-err').innerHTML = msg ? '<div class="err">' + esc(msg) + '</div>' : ''; }

async function loadFromScript() {
  const url = $('in-url').value.trim(), key = $('in-key').value;
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return showErr(T('That doesn’t look like an Apps Script /exec link.', 'Itu bukan pautan /exec Apps Script.'));
  if (!key) { $('in-key').focus(); return showErr(T('Enter the teacher key you set in the Apps Script.', 'Masukkan kunci guru yang anda tetapkan dalam Apps Script.')); }
  showErr('');
  $('btn-load').disabled = true; $('btn-load').textContent = T('Loading…', 'Memuatkan…');
  try {
    const res = await fetch(url + '?action=rows&key=' + encodeURIComponent(key), { redirect: 'follow' });
    const data = await res.json();
    if (!data.ok) {
      const m = data.code === 'NO_KEY' ? T('The Apps Script has no teacher key yet. Set TEACHER_KEY in the script and deploy a new version (see SETUP.md).', 'Apps Script belum ada kunci guru. Tetapkan TEACHER_KEY dalam skrip dan terbitkan versi baharu (lihat SETUP.md).')
        : data.code === 'BAD_KEY' ? T('That teacher key is not right.', 'Kunci guru itu tidak betul.') : (data.error || 'Error');
      throw new Error(m);
    }
    saveConn({ url, key });
    TESTS = (data.tests || []).map(cleanTest);
    useRows(data.rows, 'script');
  } catch (err) {
    showErr(err.message && err.message !== 'Failed to fetch' ? err.message
      : T('Couldn’t reach the Apps Script. If you just added the teacher key, deploy a new version — the old one doesn’t know about the dashboard yet.', 'Tidak dapat menghubungi Apps Script. Jika anda baru menambah kunci guru, terbitkan versi baharu — versi lama belum mengenali papan pemuka.'));
  } finally {
    $('btn-load').disabled = false; $('btn-load').textContent = T('Load results', 'Muatkan keputusan');
  }
}

/* A small CSV reader that copes with quoted fields and commas inside quotes. */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(x => x !== '')).map(r => { const o = {}; head.forEach((h, i) => { o[h] = r[i]; }); return o; });
}

function readFile(file, then) {
  const fr = new FileReader();
  fr.onload = () => then(String(fr.result));
  fr.readAsText(file);
}

/* Normalise one sheet row, whatever route it came by. */
const bool = v => v === true || /^(true|yes|1)$/i.test(String(v).trim());
function clean(r) {
  return {
    id: String(r.attempt_id || ''), ts: String(r.timestamp || ''), cls: String(r.class_code || '').trim(), stu: String(r.student_code || '').trim(),
    w: +r.world, lv: +r.level, correct: bool(r.correct), ok: bool(r.optimal), xp: +r.score_xp || 0,
    hints: +r.hints_used || 0, learn: +r.learn_used || 0, t: +r.time_s || 0, tag: String(r.mistake_tag || '').trim(),
    tool: String(r.boss_tool_choice || '').trim()
  };
}

function cleanTest(r) {
  let answers = null;
  try { answers = JSON.parse(r.answers || 'null'); } catch (e) {}
  return {
    id: String(r.test_id || ''), ts: String(r.timestamp || ''), cls: String(r.class_code || '').trim(), stu: String(r.student_code || '').trim(),
    test: String(r.test || ''), form: String(r.form || ''), score: +r.score || 0, max: +r.max || 0, answers,
    items: String(r.correct_items || ''), t: +r.time_s || 0, levels: +r.levels_cleared || 0, skipped: bool(r.skipped)
  };
}

function useRows(rows, src) {
  const seen = new Set();
  ALL = rows.map(clean).filter(r => r.stu && r.w && r.lv && !seen.has(r.id) && (seen.add(r.id), true));
  ALL.forEach((r, i) => { r.n = i; });                  // sheet order breaks ties inside the same minute
  source = src; loadedAt = new Date(); openStudent = null;
  const classes = [...new Set(ALL.map(r => r.cls).concat(TESTS.map(r => r.cls)))].filter(Boolean).sort();
  if (!classes.includes(current)) current = classes.length === 1 ? classes[0] : '';
  $('sel-class').innerHTML = (classes.length > 1 ? '<option value="">' + T('All classes', 'Semua kelas') + '</option>' : '') +
    classes.map(c => '<option value="' + esc(c) + '"' + (c === current ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
  $('connect').classList.add('hidden');
  $('dash').classList.remove('hidden');
  render();
}

/* ============================================================
   Numbers
   ============================================================ */
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const byTime = (a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : a.n - b.n);

function stats(rows) {
  const students = [...new Set(rows.map(r => r.stu))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const S = {};
  students.forEach(s => { S[s] = { code: s, best: {}, cleared: {}, wrong: 0, hints: 0, learn: 0, last: '', tries: 0, worlds: new Set() }; });
  rows.forEach(r => {
    const s = S[r.stu], k = r.w + '-' + r.lv;
    s.best[k] = Math.max(s.best[k] || 0, r.xp);
    if (r.ok) s.cleared[k] = true; else s.wrong++;
    s.hints += r.hints ? 1 : 0; s.learn += r.learn ? 1 : 0; s.tries++;
    s.worlds.add(r.w);
    if (r.ts > s.last) s.last = r.ts;
  });
  students.forEach(c => {
    const s = S[c];
    s.xp = Object.values(s.best).reduce((a, b) => a + b, 0);
    s.mastery = {};
    Object.keys(WORLDS).forEach(w => {
      if (!s.worlds.has(+w)) return;
      let sum = 0; for (let l = 1; l <= 5; l++) sum += s.best[w + '-' + l] || 0;
      s.mastery[w] = sum / 5;
    });
  });

  // per level: who tried, who cleared, wrong answers, hints
  const L = {};
  rows.forEach(r => {
    const k = r.w + '-' + r.lv;
    const x = L[k] || (L[k] = { w: r.w, lv: r.lv, tried: new Set(), cleared: new Set(), right: 0, wrong: 0, hintRows: 0, tags: {}, stuWrong: {} });
    x.tried.add(r.stu);
    if (r.ok) { x.cleared.add(r.stu); x.right++; if (r.hints || r.learn) x.hintRows++; }
    else { x.wrong++; x.stuWrong[r.stu] = (x.stuWrong[r.stu] || 0) + 1; }
    if (r.tag) x.tags[r.tag] = (x.tags[r.tag] || 0) + 1;
  });
  Object.values(L).forEach(x => { x.errRate = x.wrong / (x.wrong + x.right || 1); });

  // per world: mistakes as a share of all attempts
  const W = {};
  rows.forEach(r => {
    const x = W[r.w] || (W[r.w] = { attempts: 0, tags: {} });
    x.attempts++;
    if (r.tag) x.tags[r.tag] = (x.tags[r.tag] || 0) + 1;
  });
  return { students, S, L, W };
}

const topTag = tags => Object.entries(tags).sort((a, b) => b[1] - a[1])[0];

/* The one answer the page exists for. */
function renderReteach(X) {
  const minTried = Math.min(3, X.students.length);
  const cand = Object.values(X.L).filter(x => WORLDS[x.w] && x.tried.size >= minTried && x.wrong > 0).sort((a, b) => b.errRate - a.errRate);
  if (!cand.length) {
    $('reteach').innerHTML = '<div class="reteach" style="background:var(--green-soft);"><h2>' + T('Nothing stands out yet', 'Belum ada yang menonjol') + '</h2><p style="margin:0;">' +
      T('No level has enough wrong answers to point at. Check back after more students have played.', 'Tiada tahap yang cukup jawapan salah untuk ditunjukkan. Semak semula selepas lebih ramai murid bermain.') + '</p></div>';
    return;
  }
  const top = cand[0], tag = topTag(top.tags), lvName = tt(WORLDS[top.w].levels[top.lv - 1]);
  const stuck = [...top.tried].filter(s => !top.cleared.has(s));
  const strugglers = Object.entries(top.stuWrong).sort((a, b) => b[1] - a[1]).map(e => e[0]);
  const who = [...new Set(stuck.concat(strugglers))].slice(0, 8);
  const tagShare = tag ? pct(tag[1], top.wrong) : 0;
  let html = '<div class="reteach"><div class="kicker">' + T('Reteach tomorrow', 'Ajar semula esok') + '</div>' +
    '<h2>' + T('World ', 'Dunia ') + top.w + ' · ' + T('Level ', 'Tahap ') + top.lv + ' — ' + esc(lvName) + '</h2>' +
    '<p style="color:var(--ink);margin-bottom:6px;">' +
    (stuck.length
      ? T(pct(top.wrong, top.wrong + top.right) + '% of answers here were wrong, and ' + stuck.length + ' of ' + top.tried.size + ' students who tried haven’t cleared it yet.',
        pct(top.wrong, top.wrong + top.right) + '% jawapan di sini salah, dan ' + stuck.length + ' daripada ' + top.tried.size + ' murid yang mencuba belum menyelesaikannya.')
      : T('All ' + top.tried.size + ' students who tried got there in the end, but ' + pct(top.wrong, top.wrong + top.right) + '% of the answers along the way were wrong.',
        'Kesemua ' + top.tried.size + ' murid yang mencuba akhirnya berjaya, tetapi ' + pct(top.wrong, top.wrong + top.right) + '% jawapan sepanjang jalan adalah salah.')) + '</p>' +
    (tag ? '<p style="color:var(--ink);margin-bottom:0;">' + T('Most common mistake: ', 'Kesilapan paling kerap: ') + '<b>' + esc(tagLabel(tag[0])) + '</b> (' +
      T(tagShare + '% of the wrong answers)', tagShare + '% daripada jawapan salah)') + '</p>' : '') +
    (tag && TAGS[tag[0]] ? '<div class="tip">💡 ' + esc(tt(TAGS[tag[0]].tip)) + '</div>' : '') +
    (who.length ? '<p style="margin:0;font-size:14px;">' + T('Check in with: ', 'Semak dengan: ') + who.map(s => '<b class="ink">' + esc(s) + '</b>').join(', ') + '</p>' : '') +
    '</div>';
  if (cand.length > 1) {
    html += '<div class="also">' + cand.slice(1, 3).map(x => {
      const t = topTag(x.tags);
      return '<div class="flag"><b>' + T('Also: World ', 'Juga: Dunia ') + x.w + ' · ' + T('Level ', 'Tahap ') + x.lv + ' · ' + pct(x.wrong, x.wrong + x.right) + T('% wrong', '% salah') + '</b>' +
        '<span>' + esc(tt(WORLDS[x.w].levels[x.lv - 1])) + (t ? ' — ' + esc(tagLabel(t[0])) : '') + '</span></div>';
    }).join('') + '</div>';
  }
  $('reteach').innerHTML = html;
}

    const st = X.S[s];
    const cell = w => st.mastery[w] == null ? '<td class="num muted">—</td>' : '<td class="num' + (st.mastery[w] < 70 ? ' low' : '') + '">' + Math.round(st.mastery[w]) + '%</td>';
    return '<tr class="pick" data-stu="' + esc(s) + '"><td><b>' + esc(s) + '</b></td><td class="num">' + st.xp + '</td>' + WKEYS.map(w => cell(w)).join('') +
      '<td class="num">' + Object.keys(st.cleared).filter(k => WORLDS[k.split('-')[0]]).length + '</td><td class="num">' + st.wrong + '</td><td class="num">' + (st.hints + st.learn) + '</td><td class="muted">' + esc(st.last.slice(0, 16).replace('T', ' ')) + '</td></tr>';
  }).join('');
  $('students').innerHTML = '<table><tr><th>' + T('Student', 'Murid') + '</th><th class="num">XP</th>' + WKEYS.map(w => '<th class="num">' + T('World ', 'Dunia ') + w + '</th>').join('') +
    '<th class="num">' + T('Levels cleared', 'Tahap selesai') + '</th><th class="num">' + T('Wrong', 'Salah') + '</th><th class="num">' + T('Help used', 'Bantuan') + '</th><th>' + T('Last active', 'Aktif terakhir') + '</th></tr>' + body + '</table>';
  renderStudent(X, rows);
}

function renderStudent(X, rows) {
  if (!openStudent || !X.S[openStudent]) { $('student').innerHTML = ''; return; }
  const st = X.S[openStudent], mine = rows.filter(r => r.stu === openStudent).sort(byTime);
  const rank = tt(RANKS[Math.min(Math.floor(st.xp / 500), RANKS.length - 1)]);
  const worlds = Object.keys(WORLDS).filter(w => st.mastery[w] != null).map(w => {
    const lv = WORLDS[w].levels.map((name, i) => {
      const a = mine.filter(r => r.w === +w && r.lv === i + 1);
      return '<tr><td>' + w + '.' + (i + 1) + ' ' + esc(tt(name)) + '</td><td class="trail">' + (a.length ? a.slice(-10).map(r => r.ok ? '✓' : '✗').join(' → ') : '—') + '</td>' +
        '<td class="num">' + (st.best[w + '-' + (i + 1)] || 0) + '</td><td>' + esc([...new Set(a.filter(r => r.tag).map(r => tagLabel(r.tag)))].join('; ')) + '</td></tr>';
    }).join('');
    return '<h3 style="margin:16px 0 4px;">' + T('World ', 'Dunia ') + w + ' · ' + esc(tt(WORLDS[w].name)) + ' — ' + Math.round(st.mastery[w]) + '%</h3>' +
      '<table><tr><th>' + T('Level', 'Tahap') + '</th><th>' + T('Attempts, oldest first', 'Cubaan, terawal dahulu') + '</th><th class="num">' + T('Best', 'Terbaik') + '</th><th>' + T('Mistakes', 'Kesilapan') + '</th></tr>' + lv + '</table>';
  }).join('');
  $('student').innerHTML = '<div class="student"><div class="row spread"><h2 style="margin:0;">' + esc(openStudent) + '</h2><button class="btn ghost sm" id="btn-close-stu">' + T('Close', 'Tutup') + '</button></div>' +
    '<div class="kpis"><div class="kpi"><b>' + st.xp + ' XP</b><span>' + esc(rank) + '</span></div>' +
    '<div class="kpi"><b>' + Object.keys(st.cleared).filter(k => WORLDS[k.split('-')[0]]).length + '</b><span>' + T('levels cleared', 'tahap selesai') + '</span></div>' +
    '<div class="kpi"><b>' + st.wrong + '</b><span>' + T('wrong answers', 'jawapan salah') + '</span></div>' +
    '<div class="kpi"><b>' + (st.hints + st.learn) + '</b><span>' + T('attempts using Hint or Learn', 'cubaan guna Petunjuk atau Belajar') + '</span></div></div>' +
    worlds + '<p class="muted" style="margin:12px 0 0;">' + T('XP here counts level scores only; the +20 Discover bonus stays on the student’s device.', 'XP di sini mengira markah tahap sahaja; bonus Temui +20 kekal pada peranti murid.') + '</p></div>';
  $('btn-close-stu').addEventListener('click', () => { openStudent = null; $('student').innerHTML = ''; });
  $('student').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- Boss Level: did they choose the right idea? ----------
   Each student's first tool pick per mission (every row of a mission carries
   it) — the cleanest measure of problem-solving in the game. */
function renderBoss(rows) {
  $('k-boss').textContent = T('Part five', 'Bahagian lima');
  $('h-boss').textContent = T('Boss Level: choosing the right idea', 'Tahap Bos: memilih idea yang betul');
  const b = rows.filter(r => r.w === 7);
  if (!b.length) { $('boss').innerHTML = '<p style="margin:0;">' + T('No one has reached the Boss Level yet. It opens once a student has cleared Worlds 1–4.', 'Belum ada yang sampai ke Tahap Bos. Ia dibuka setelah murid menyelesaikan Dunia 1–4.') + '</p>'; return; }
  const body = BOSS_MISSIONS.map((M, k) => {
    const mr = b.filter(r => r.lv === k + 1).sort(byTime), first = {};
    mr.forEach(r => { if (!(r.stu in first) && r.tool) first[r.stu] = r.tool; });
    const picks = Object.values(first), right = picks.filter(p => p === M.tool).length;
    const wrongPicks = {}; picks.filter(p => p !== M.tool).forEach(p => { wrongPicks[p] = (wrongPicks[p] || 0) + 1; });
    const topWrong = Object.entries(wrongPicks).sort((a, c) => c[1] - a[1])[0];
    const solved = new Set(mr.filter(r => r.ok).map(r => r.stu)).size, t = topTag(mr.reduce((a, r) => { if (r.tag) a[r.tag] = (a[r.tag] || 0) + 1; return a; }, {}));
    const p = pct(right, picks.length);
    return '<tr><td>' + (k + 1) + '. ' + esc(tt(M.name)) + '<br><span class="muted">' + T('needs ', 'perlu ') + esc(tt(TOOL_NAMES[M.tool])) + '</span></td>' +
      '<td class="num' + (p < 60 ? ' low' : '') + '">' + (picks.length ? p + '%' : '—') + '</td><td class="num">' + picks.length + '</td>' +
      '<td>' + (topWrong ? esc(tt(TOOL_NAMES[topWrong[0]] || [topWrong[0], topWrong[0]])) + ' (' + topWrong[1] + ')' : '—') + '</td>' +
      '<td class="num">' + solved + '</td><td>' + (t ? esc(tagLabel(t[0])) : '—') + '</td></tr>';
  }).join('');
  $('boss').innerHTML = '<p>' + T('Before each mission, students pick which world’s idea to use — with no hint. The first pick shows whether they can recognise the right idea, not just use it when told.',
    'Sebelum setiap misi, murid memilih idea dunia mana yang hendak digunakan — tanpa petunjuk. Pilihan pertama menunjukkan sama ada mereka dapat mengenal pasti idea yang betul, bukan sekadar menggunakannya apabila disuruh.') + '</p>' +
    '<div class="scroll"><table><tr><th>' + T('Mission', 'Misi') + '</th><th class="num">' + T('Right first pick', 'Pilihan pertama betul') + '</th><th class="num">' + T('Students', 'Murid') + '</th><th>' + T('Most common wrong pick', 'Pilihan salah paling kerap') + '</th><th class="num">' + T('Solved', 'Selesai') + '</th><th>' + T('Top mistake', 'Kesilapan utama') + '</th></tr>' + body + '</table></div>';
}

/* ---------- pre-test / post-test ----------
   In-app tests (the Tests tab) are used when there are any. A pre-test only
   counts if it was taken before the student cleared a level. Students with
   game attempts are the game group; those with none are the control group.
   A paper-test CSV (student_code, pre, post) can be opened instead. */
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const f1 = x => (Math.round(x * 10) / 10).toFixed(1);
function paired(list) {
  const gains = list.map(p => p.post - p.pre), g = mean(gains);
  const sd = gains.length > 1 ? Math.sqrt(gains.reduce((a, x) => a + (x - g) * (x - g), 0) / (gains.length - 1)) : 0;
  return { n: list.length, pre: mean(list.map(p => p.pre)), post: mean(list.map(p => p.post)), gain: g,
    up: pct(gains.filter(x => x > 0).length, gains.length), t: sd ? g / (sd / Math.sqrt(gains.length)) : 0 };
}

function renderPrePost(X) {
  $('k-prepost').textContent = T('Part six', 'Bahagian enam');
  $('h-prepost').textContent = T('Pre-test and post-test', 'Ujian pra dan ujian pasca');
  const loader = '<span class="btn ghost sm file"><span>' + T('Open paper-test CSV', 'Buka CSV ujian kertas') + '</span><input type="file" id="in-pre" accept=".csv,text/csv"></span>';
  const tests = TESTS.filter(r => !current || r.cls === current);
  const played = new Set(ALL.map(r => r.stu));
  let pairs = [], notes = [], itemsPre = [], itemsPost = [];

  if (PRE) {
    pairs = PRE.filter(p => !current || p.stu.indexOf(current.split('-')[0] + '-') === 0).filter(p => !isNaN(p.pre) && !isNaN(p.post))
      .map(p => ({ stu: p.stu, pre: p.pre, post: p.post, game: played.has(p.stu) }));
  } else if (tests.some(r => r.test === 'pre' || r.test === 'post')) {
    const by = {};
    tests.forEach(r => { (by[r.stu] = by[r.stu] || []).push(r); });
    let skipped = 0, late = 0, preOnly = 0, postOnly = 0;
    Object.keys(by).forEach(stu => {
      const rs = by[stu].sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));
      const pres = rs.filter(r => r.test === 'pre');
      const pre = pres.find(r => !r.skipped && r.levels === 0);
      if (!pre && pres.some(r => r.skipped)) skipped++;
      if (!pre && pres.some(r => !r.skipped && r.levels > 0)) late++;
      const post = rs.filter(r => r.test === 'post').slice(-1)[0];
      const game = played.has(stu);
      if (pre && game) itemsPre.push(pre.items);
      if (post && game) itemsPost.push(post.items);
      if (pre && post) pairs.push({ stu, pre: pre.score, post: post.score, max: post.max, game, preForm: pre.form, postForm: post.form, levels: post.levels });
      else if (pre) preOnly++;
      else if (post) postOnly++;
    });
    if (preOnly) notes.push(T(preOnly + ' with a pre-test but no post-test yet', preOnly + ' ada ujian pra tetapi belum ujian pasca'));
    if (postOnly) notes.push(T(postOnly + ' with a post-test but no usable pre-test', postOnly + ' ada ujian pasca tetapi tiada ujian pra yang sah'));
    if (skipped) notes.push(T(skipped + ' skipped the pre-test', skipped + ' melangkau ujian pra'));
    if (late) notes.push(T(late + ' took the pre-test after playing (left out)', late + ' menjawab ujian pra selepas bermain (tidak dikira)'));
  }

  if (!pairs.length && !tests.length) {
    $('prepost').innerHTML = '<p>' + T('Students take the pre-test in Graph Quest before their first level, and the post-test once they have cleared ' + GQT.POST_AFTER_LEVELS + ' levels and submitted results. A control class that doesn’t play uses the link <b class="ink">…/graphquest/?test=pre</b> and <b class="ink">?test=post</b>. Results appear here automatically.',
      'Murid menjawab ujian pra dalam Graph Quest sebelum tahap pertama, dan ujian pasca setelah menyelesaikan ' + GQT.POST_AFTER_LEVELS + ' tahap dan menghantar keputusan. Kelas kawalan yang tidak bermain guna pautan <b class="ink">…/graphquest/?test=pre</b> dan <b class="ink">?test=post</b>. Keputusan dipaparkan di sini secara automatik.') +
      '</p><p class="muted">' + T('Used paper tests instead? Open a CSV with columns student_code, pre, post.', 'Guna ujian kertas? Buka CSV dengan lajur student_code, pre, post.') + '</p>' + loader;
    wirePre();
    return;
  }

  const grp = (list, label, cls) => {
    if (!list.length) return '';
    const r = paired(list);
    return '<div class="card" style="margin-top:14px;"><h3>' + label + ' <span class="pill ' + cls + '">n = ' + r.n + '</span></h3><div class="kpis">' +
      '<div class="kpi"><b>' + f1(r.pre) + '</b><span>' + T('pre-test mean', 'min ujian pra') + '</span></div>' +
      '<div class="kpi"><b>' + f1(r.post) + '</b><span>' + T('post-test mean', 'min ujian pasca') + '</span></div>' +
      '<div class="kpi"><b>' + (r.gain >= 0 ? '+' : '') + f1(r.gain) + '</b><span>' + T('mean gain', 'min peningkatan') + '</span></div>' +
      '<div class="kpi"><b>' + r.up + '%</b><span>' + T('improved', 'meningkat') + '</span></div></div>' +
      '<p class="muted" style="margin:6px 0 0;">' + T('Paired t = ' + r.t.toFixed(2) + ', df = ' + Math.max(r.n - 1, 0) + '. Confirm the p-value in SPSS or Excel; with a small class use Wilcoxon.', 't berpasangan = ' + r.t.toFixed(2) + ', df = ' + Math.max(r.n - 1, 0) + '. Sahkan nilai-p dalam SPSS atau Excel; bagi kelas kecil guna Wilcoxon.') + '</p></div>';
  };
  const game = pairs.filter(p => p.game), ctrl = pairs.filter(p => !p.game);
  let html = (PRE ? '<p class="muted">' + T('From the paper-test CSV.', 'Daripada CSV ujian kertas.') + '</p>' : '<p class="muted">' + T('From the in-game tests (out of 10). Forms A and B are swapped between pre and post.', 'Daripada ujian dalam permainan (daripada 10). Borang A dan B ditukar antara pra dan pasca.') + '</p>') +
    grp(game, T('Played Graph Quest', 'Bermain Graph Quest'), 'done') +
    grp(ctrl, T('Didn’t play (control)', 'Tidak bermain (kawalan)'), 'new');
  if (game.length && ctrl.length) {
    const d = paired(game).gain - paired(ctrl).gain;
    html += '<p style="margin-top:14px;color:var(--ink);"><b>' + T('Difference in mean gain: ', 'Beza min peningkatan: ') + (d >= 0 ? '+' : '') + f1(d) + '</b> ' +
      T('(game group minus control). Test it with an independent-samples t-test on the gains.', '(kumpulan permainan tolak kawalan). Uji dengan ujian-t sampel tak bersandar ke atas peningkatan.') + '</p>';
  }
  if (!pairs.length) html += '<p style="margin-top:12px;">' + T('No student has both tests yet.', 'Belum ada murid yang menjawab kedua-dua ujian.') + '</p>';
  if (notes.length) html += '<p class="muted" style="margin-top:10px;">' + notes.join(' · ') + '</p>';

  // question by question (game group)
  if (itemsPre.length || itemsPost.length) {
    const rate = (list, j) => pct(list.filter(s => s[j] === '1').length, list.length);
    html += '<h3 style="margin:22px 0 4px;">' + T('Question by question', 'Soalan demi soalan') + '</h3><p class="muted" style="margin:0 0 6px;">' +
      T('Share correct, game group. Item n tests the same idea on both forms.', 'Peratus betul, kumpulan permainan. Item n menguji idea yang sama pada kedua-dua borang.') + '</p>' +
      '<div class="scroll"><table><tr><th>#</th><th>' + T('Idea', 'Idea') + '</th><th class="num">' + T('Pre', 'Pra') + '</th><th class="num">' + T('Post', 'Pasca') + '</th><th class="num">' + T('Change', 'Perubahan') + '</th></tr>' +
      GQT.SLOTS.map((sl, j) => {
        const a = rate(itemsPre, j), b = rate(itemsPost, j), d = b - a;
        return '<tr><td>' + (j + 1) + '</td><td>' + esc(tt(sl)) + '</td><td class="num">' + (itemsPre.length ? a + '%' : '—') + '</td><td class="num">' + (itemsPost.length ? b + '%' : '—') + '</td>' +
          '<td class="num' + (itemsPre.length && itemsPost.length && d < 0 ? ' low' : '') + '">' + (itemsPre.length && itemsPost.length ? (d >= 0 ? '+' : '') + d : '—') + '</td></tr>';
      }).join('') + '</table></div>';
  }

  // survey
  const surveys = tests.filter(r => r.test === 'survey' && r.answers && Array.isArray(r.answers.likert));
  if (surveys.length) {
    const comments = surveys.map(r => (r.answers.comment || '').trim()).filter(Boolean);
    html += '<h3 style="margin:22px 0 4px;">' + T('Engagement survey', 'Soal selidik penglibatan') + ' <span class="pill new">n = ' + surveys.length + '</span></h3>' +
      GQT.SURVEY.map((q, j) => {
        const vals = surveys.map(r => r.answers.likert[j]).filter(v => v >= 1 && v <= 5), m = mean(vals);
        return '<div class="m-row"><div class="m-top"><span>' + (j + 1) + '. ' + esc(tt(q)) + '</span><b>' + f1(m) + ' / 5</b></div><div class="m-bar"><i class="b" style="width:' + (m / 5 * 100) + '%"></i></div></div>';
      }).join('') +
      (comments.length ? '<h3 style="margin:18px 0 6px;font-size:15px;">' + T('In their words', 'Kata-kata mereka') + '</h3>' +
        comments.slice(-6).map(c => '<div class="flag" style="margin-top:8px;"><span style="font-size:14px;color:var(--ink);">“' + esc(c) + '”</span></div>').join('') : '');
  }

  // per student
  if (pairs.length) {
    html += '<h3 style="margin:22px 0 4px;">' + T('Every student', 'Setiap murid') + '</h3><div class="scroll"><table><tr><th>' + T('Student', 'Murid') + '</th><th>' + T('Group', 'Kumpulan') + '</th><th class="num">' + T('Pre', 'Pra') + '</th><th class="num">' + T('Post', 'Pasca') + '</th><th class="num">' + T('Gain', 'Peningkatan') +
      '</th>' + WKEYS.map(w => '<th class="num">' + T('World ', 'Dunia ') + w + '</th>').join('') + '</tr>' +
      pairs.sort((a, b) => a.stu.localeCompare(b.stu, undefined, { numeric: true })).map(p => {
        const st = X.S[p.stu], m = w => st && st.mastery[w] != null ? Math.round(st.mastery[w]) + '%' : '—';
        return '<tr><td>' + esc(p.stu) + '</td><td>' + (p.game ? T('game', 'permainan') : T('control', 'kawalan')) + '</td><td class="num">' + p.pre + '</td><td class="num">' + p.post + '</td><td class="num' + (p.post - p.pre < 0 ? ' low' : '') + '">' + (p.post - p.pre >= 0 ? '+' : '') + (p.post - p.pre) + '</td>' + WKEYS.map(w => '<td class="num">' + m(w) + '</td>').join('') + '</tr>';
      }).join('') + '</table></div>';
  }
  $('prepost').innerHTML = html + '<div style="margin-top:14px;">' + loader + (PRE ? ' <button class="btn ghost sm" id="btn-pre-clear">' + T('Use in-game tests', 'Guna ujian dalam permainan') + '</button>' : '') + '</div>';
  wirePre();
}

function wirePre() {
  $('in-pre').addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    readFile(f, text => {
      PRE = parseCSV(text).map(r => ({ stu: String(r.student_code || r.student || '').trim(), pre: parseFloat(r.pre), post: parseFloat(r.post) })).filter(p => p.stu);
      render();
    });
  });
  const c = $('btn-pre-clear');
  if (c) c.addEventListener('click', () => { PRE = null; render(); });
}

/* ============================================================
   Wiring
   ============================================================ */
$('btn-lang').addEventListener('click', () => {
  LANG = LANG === 'bm' ? 'en' : 'bm';
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  render();
});
$('btn-load').addEventListener('click', loadFromScript);
$('in-key').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromScript(); });
/* One or two CSVs: the Attempts tab and/or the Tests tab, told apart by their columns. */
$('in-csv').addEventListener('change', ev => {
  const files = [...ev.target.files]; if (!files.length) return;
  let attempts = null, left = files.length;
  files.forEach(f => readFile(f, text => {
    const rows = parseCSV(text);
    if (rows.length && 'test_id' in rows[0]) TESTS = rows.map(cleanTest);
    else if (rows.length && 'attempt_id' in rows[0]) attempts = rows;
    if (--left) return;
    if (!attempts && !TESTS.length) return showErr(T('Those files don’t look like the Attempts or Tests tabs.', 'Fail itu bukan tab Attempts atau Tests.'));
    showErr(''); useRows(attempts || [], 'csv');
  }));
  ev.target.value = '';
});
$('sel-class').addEventListener('change', e => { current = e.target.value; openStudent = null; render(); });
$('btn-reload').addEventListener('click', () => { const c = conn(); $('in-url').value = c.url; $('in-key').value = c.key; loadFromScript(); });
$('btn-disconnect').addEventListener('click', () => { $('dash').classList.add('hidden'); $('connect').classList.remove('hidden'); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-stu]');
  if (!t) return;
  openStudent = t.dataset.stu;
  const rows = ALL.filter(r => !current || r.cls === current);
  renderStudent(stats(rows), rows);
});

/* ---------- go ---------- */
(function init() {
  const c = conn();
  $('in-url').value = c.url || DEFAULT_ENDPOINT;
  if (c.key) $('in-key').value = c.key;
  renderStatic();
  if (c.url && c.key) loadFromScript();
})();
</script>
