// ===== STATE =====
let vertices = [], edges = [];
let stageIdx = 0;
let editMode = false;
let selection = null;
let pendingConnectFrom = null;
let walkSeq = [];
let spanningTreeHighlight = null;
let selectedStart = null, selectedEnd = null;
let dijkstraAnim = null, dijkstraTimer = null, dijkstraResult = null;
let isDark = false;

// ===== GRAPH HELPERS =====
function edgeKey(a, b) { return [a, b].slice().sort().join("-"); }
function edgesBetween(a, b) { return edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a)); }
function edgesIncident(id) { return edges.filter(e => e.a === id || e.b === id); }
function otherEnd(e, id) { return e.a === id ? e.b : e.a; }
function degreeOf(id) { return edgesIncident(id).length; }
function neighborsOf(id) { return edgesIncident(id).map(e => otherEnd(e, id)); }
function nextLetter() {
  const used = new Set(vertices.map(v => v.id));
  for (let i = 0; i < 26; i++) { const c = String.fromCharCode(65 + i); if (!used.has(c)) return c; }
  return null;
}

function connectivityInfo() {
  if (vertices.length === 0) return { connected: true, reached: new Set() };
  const seen = new Set([vertices[0].id]);
  const stack = [vertices[0].id];
  while (stack.length) {
    const u = stack.pop();
    edgesIncident(u).forEach(e => { const w = otherEnd(e, u); if (!seen.has(w)) { seen.add(w); stack.push(w); } });
  }
  return { connected: seen.size === vertices.length, reached: seen };
}

function treeCheck() {
  const n = vertices.length, m = edges.length;
  if (n === 0) return { isTree: false, msg: tr(I18N.treeAddVertices) };
  const { connected, reached } = connectivityInfo();
  if (!connected) {
    const missing = vertices.filter(v => !reached.has(v.id)).map(v => v.id);
    return { isTree: false, msg: tr({
      en: `Not a tree — disconnected. ${missing.join(", ")} ${missing.length > 1 ? "are" : "is"} not reachable from ${vertices[0].id}.`,
      bm: `Bukan pokok — terputus. ${missing.join(", ")} tidak boleh dicapai daripada ${vertices[0].id}.`
    }) };
  }
  if (m > n - 1) return { isTree: false, msg: tr({
    en: `Not a tree — contains a cycle. A tree on ${n} vertices needs exactly ${n - 1} edge${n - 1 === 1 ? "" : "s"}, but this graph has ${m}.`,
    bm: `Bukan pokok — mengandungi kitaran. Pokok dengan ${n} bucu memerlukan tepat ${n - 1} sisi, tetapi graf ini mempunyai ${m}.`
  }) };
  return { isTree: true, msg: tr({
    en: `This is a tree — connected, with exactly ${n - 1} edge${n - 1 === 1 ? "" : "s"} and no cycles.`,
    bm: `Ini ialah sebuah pokok — tersambung, dengan tepat ${n - 1} sisi dan tiada kitaran.`
  }) };
}

function computeSpanningTree() {
  if (vertices.length === 0) return [];
  const seen = new Set([vertices[0].id]);
  const treeEdges = [];
  const stack = [vertices[0].id];
  while (stack.length) {
    const u = stack.pop();
    for (const e of edgesIncident(u)) {
      const w = otherEnd(e, u);
      if (!seen.has(w)) { seen.add(w); treeEdges.push(e.id); stack.push(w); }
    }
  }
  return treeEdges;
}

function classifyWalk(seq) {
  if (seq.length < 2) return { type: null };
  const edgeIds = [];
  for (let i = 0; i < seq.length - 1; i++) { const e = edgesBetween(seq[i], seq[i + 1]); if (e) edgeIds.push(e.id); }
  const closed = seq[0] === seq[seq.length - 1];
  const edgeSet = new Set(); let repeatedEdge = false;
  edgeIds.forEach(id => { if (edgeSet.has(id)) repeatedEdge = true; edgeSet.add(id); });
  const vertCounts = {};
  seq.forEach((id, idx) => { if (closed && idx === seq.length - 1) return; vertCounts[id] = (vertCounts[id] || 0) + 1; });
  const repeatedVertex = Object.values(vertCounts).some(c => c > 1);
  if (repeatedEdge) return { type: "walk", ok: false, msg: tr({
    en: "This is a walk, but it repeats an edge — so it is not a trail.",
    bm: "Ini ialah satu jalan, tetapi ia mengulangi satu sisi — jadi ia bukan surih."
  }) };
  if (repeatedVertex) return { type: "trail", ok: false, msg: closed ? tr({
    en: "This is a closed trail, but it repeats an interior vertex — so it is not a simple cycle.",
    bm: "Ini ialah surih tertutup, tetapi ia mengulangi bucu dalaman — jadi ia bukan kitaran ringkas."
  }) : tr({
    en: "This is a trail (no repeated edge), but it repeats a vertex — so it is not a path.",
    bm: "Ini ialah satu surih (tiada sisi berulang), tetapi ia mengulangi satu bucu — jadi ia bukan lorong."
  }) };
  if (closed) return { type: "cycle", ok: true, msg: tr({
    en: "This is a cycle — a path that returns to where it started.",
    bm: "Ini ialah satu kitaran — lorong yang kembali ke tempat ia bermula."
  }) };
  return { type: "path", ok: true, msg: tr({
    en: "This is a path — no repeated vertex or edge.",
    bm: "Ini ialah satu lorong — tiada bucu atau sisi berulang."
  }) };
}

function dijkstra(startId) {
  const dist = {}, prev = {}, visited = new Set(), steps = [];
  vertices.forEach(v => dist[v.id] = Infinity);
  dist[startId] = 0;
  while (visited.size < vertices.length) {
    let u = null, best = Infinity;
    for (const v of vertices) { if (!visited.has(v.id) && dist[v.id] < best) { best = dist[v.id]; u = v.id; } }
    if (u === null) break;
    visited.add(u);
    steps.push({ finalized: u, dist: dist[u] });
    for (const e of edgesIncident(u)) {
      const w = otherEnd(e, u);
      if (visited.has(w)) continue;
      const nd = dist[u] + e.weight;
      if (nd < dist[w]) { dist[w] = nd; prev[w] = u; }
    }
  }
  return { dist, prev, steps };
}

function finalizeShortestPathResult(startId, endId, dist, prev, order) {
  if (dist[endId] === Infinity) { dijkstraResult = { unreachable: true, startId, endId }; return; }
  const path = [endId]; let cur = endId;
  while (cur !== startId) { cur = prev[cur]; path.unshift(cur); }
  const pathEdges = new Set();
  for (let i = 0; i < path.length - 1; i++) { const e = edgesBetween(path[i], path[i + 1]); if (e) pathEdges.add(e.id); }
  dijkstraResult = {
    startId, endId, distance: dist[endId], path, pathEdges, order,
    distTable: vertices.map(v => ({ id: v.id, dist: dist[v.id], via: prev[v.id] || "—" }))
  };
}

function runShortestPath(startId, endId) {
  clearTimeout(dijkstraTimer);
  const { dist, prev, steps } = dijkstra(startId);
  dijkstraAnim = { finalized: new Set(), current: null };
  let i = 0;
  function tick() {
    if (i >= steps.length) {
      dijkstraAnim = null;
      finalizeShortestPathResult(startId, endId, dist, prev, steps.map(s => s.finalized));
      renderAll();
      return;
    }
    dijkstraAnim.current = steps[i].finalized;
    renderAll();
    dijkstraTimer = setTimeout(() => {
      dijkstraAnim.finalized.add(steps[i].finalized);
      dijkstraAnim.current = null;
      i++;
      dijkstraTimer = setTimeout(tick, 150);
    }, 450);
  }
  tick();
}

// ===== GRAPH MUTATION =====
function clearDerivedHighlights() { spanningTreeHighlight = null; dijkstraResult = null; dijkstraAnim = null; clearTimeout(dijkstraTimer); }

function addVertexAt(x, y) {
  if (vertices.length >= 20) return;
  const id = nextLetter();
  if (!id) return;
  vertices.push({ id, x: clamp(x, 26, 614), y: clamp(y, 26, 394) });
  clearDerivedHighlights();
  renderAll();
}

function deleteVertex(id) {
  edges = edges.filter(e => e.a !== id && e.b !== id);
  vertices = vertices.filter(v => v.id !== id);
  walkSeq = walkSeq.filter(v => v !== id);
  clearDerivedHighlights();
}

function deleteEdge(id) {
  edges = edges.filter(e => e.id !== id);
  clearDerivedHighlights();
}

function toggleEdge(a, b) {
  const key = edgeKey(a, b);
  const idx = edges.findIndex(e => e.id === key);
  if (idx >= 0) edges.splice(idx, 1);
  else edges.push({ id: key, a, b, weight: 1 });
  clearDerivedHighlights();
}

function resetTransientState() {
  selection = null; pendingConnectFrom = null; walkSeq = [];
  clearDerivedHighlights();
  selectedStart = null; selectedEnd = null;
}

function loadPreset(key) {
  const p = PRESETS[key];
  vertices = p.vertices.map(v => ({ id: v.id, x: v.x, y: v.y }));
  edges = p.edges.map(e => ({ id: edgeKey(e[0], e[1]), a: e[0], b: e[1], weight: e[2] || 1 }));
  resetTransientState();
  renderAll();
}

// ===== INTERACTION =====
function toSvgPoint(svg, clientX, clientY) {
  const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function extendWalk(vid) {
  if (walkSeq.length === 0) { walkSeq = [vid]; return; }
  const last = walkSeq[walkSeq.length - 1];
  if (last === vid) return;
  if (!edgesBetween(last, vid)) return;
  walkSeq.push(vid);
}

function handleVertexClick(v) {
  if (editMode) {
    if (pendingConnectFrom && pendingConnectFrom !== v.id) {
      toggleEdge(pendingConnectFrom, v.id);
      pendingConnectFrom = null; selection = null;
    } else if (pendingConnectFrom === v.id) {
      pendingConnectFrom = null; selection = null;
    } else {
      pendingConnectFrom = v.id; selection = { type: "vertex", id: v.id };
    }
  } else if (stageIdx === 1) {
    extendWalk(v.id);
  } else {
    selection = (selection && selection.type === "vertex" && selection.id === v.id) ? null : { type: "vertex", id: v.id };
  }
  renderAll();
}

function handleEdgeClick(e) {
  selection = { type: "edge", id: e.id };
  renderAll();
}

function startVertexDrag(e, v) {
  e.stopPropagation();
  const svg = document.getElementById("graphSvg");
  let dragging = false;
  const startX = e.clientX, startY = e.clientY;
  function onMove(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!dragging && Math.hypot(dx, dy) > 4) dragging = true;
    if (dragging) {
      const p = toSvgPoint(svg, ev.clientX, ev.clientY);
      v.x = clamp(p.x, 26, 614); v.y = clamp(p.y, 26, 394);
      renderGraphSVG();
    }
  }
  function onUp() {
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    if (!dragging) handleVertexClick(v);
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

function renderGraphSVG() {
  const svg = document.getElementById("graphSvg");
  svg.innerHTML = "";
  const bg = mk("rect", { x: 0, y: 0, width: 640, height: 420, rx: 10, fill: "var(--panel-2)", stroke: "var(--rule)", "stroke-width": 1 });
  bg.addEventListener("pointerdown", (e) => {
    if (!editMode) { if (pendingConnectFrom) { pendingConnectFrom = null; selection = null; renderAll(); } return; }
    const pt = toSvgPoint(svg, e.clientX, e.clientY);
    addVertexAt(pt.x, pt.y);
  });
  svg.appendChild(bg);

  const spanSet = spanningTreeHighlight ? new Set(spanningTreeHighlight) : null;
  const pathSet = dijkstraResult && dijkstraResult.pathEdges ? dijkstraResult.pathEdges : null;
  const walkEdgeSet = new Set();
  for (let i = 0; i < walkSeq.length - 1; i++) { const e = edgesBetween(walkSeq[i], walkSeq[i + 1]); if (e) walkEdgeSet.add(e.id); }

  edges.forEach(e => {
    const a = vertices.find(v => v.id === e.a), b = vertices.find(v => v.id === e.b);
    if (!a || !b) return;
    let stroke = "var(--ink-2)", width = 2, opacity = 1;
    if (spanSet) { if (spanSet.has(e.id)) { stroke = "var(--shade)"; width = 4; } else { opacity = .3; } }
    if (pathSet) { if (pathSet.has(e.id)) { stroke = "var(--shade)"; width = 4; } else { opacity = .35; } }
    if (walkEdgeSet.has(e.id)) { stroke = "var(--accent)"; width = 3; }
    const g = mk("g", {});
    const line = mk("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke, "stroke-width": width, "stroke-linecap": "round", opacity });
    const hit = mk("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "transparent", "stroke-width": 16, style: "cursor:pointer" });
    hit.addEventListener("pointerdown", (ev) => { ev.stopPropagation(); handleEdgeClick(e); });
    g.appendChild(line); g.appendChild(hit);
    if (stageIdx === 3) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const wbg = mk("rect", { x: mx - 13, y: my - 10, width: 26, height: 16, rx: 4, fill: "var(--panel)", stroke: "var(--rule)" });
      const wt = mk("text", { x: mx, y: my + 2, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 700 });
      wt.textContent = e.weight;
      g.appendChild(wbg); g.appendChild(wt);
    }
    svg.appendChild(g);
  });

  vertices.forEach(v => {
    const g = mk("g", { style: "cursor:pointer" });
    let fill = "var(--panel)", stroke = "var(--ink)", sw = 2;
    let opacity = 1;
    if (stageIdx === 3) {
      if (v.id === selectedStart) fill = "var(--accent-soft)";
      if (v.id === selectedEnd) fill = "var(--accent-soft)";
    }
    if (dijkstraAnim) {
      if (dijkstraAnim.finalized.has(v.id)) { fill = "var(--ok-soft)"; stroke = "var(--ok)"; }
      if (dijkstraAnim.current === v.id) { stroke = "var(--accent)"; sw = 3; }
    }
    if (pendingConnectFrom === v.id) { stroke = "var(--accent)"; sw = 3; }
    if (selection && selection.type === "vertex" && selection.id === v.id) { stroke = "var(--accent)"; sw = 3; }
    if (stageIdx === 1 && !editMode && walkSeq.length) {
      const last = walkSeq[walkSeq.length - 1];
      const isNext = v.id !== last && edgesBetween(last, v.id);
      const inSeq = walkSeq.includes(v.id);
      if (!isNext && !inSeq) opacity = .4;
      if (inSeq) { stroke = "var(--accent)"; sw = 3; }
    }
    const circle = mk("circle", { cx: v.x, cy: v.y, r: 20, fill, stroke, "stroke-width": sw, opacity });
    const label = mk("text", { x: v.x, y: v.y + 6, "text-anchor": "middle", "font-size": 16, "font-style": "italic", "font-family": "'Fraunces',Georgia,serif", fill: "var(--ink)", "font-weight": 600, opacity });
    label.textContent = v.id;
    g.appendChild(circle); g.appendChild(label);
    g.addEventListener("pointerdown", (e) => startVertexDrag(e, v));
    svg.appendChild(g);
  });
}

function renderSelectionCard() {
  const el = document.getElementById("selectionCard");
  if (!selection) { el.innerHTML = `<p class="text-xs m-0" style="color:var(--ink-3)">${tr(I18N.selectionPlaceholder)}</p>`; return; }
  if (selection.type === "vertex") {
    const v = vertices.find(x => x.id === selection.id);
    if (!v) { selection = null; return renderSelectionCard(); }
    const nbrs = neighborsOf(v.id).sort();
    el.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <span class="math" style="font-size:22px;color:var(--accent);">${v.id}</span>
        ${editMode ? `<button id="delVertexBtn" class="btn btn-ghost btn-sm">${tr(I18N.deleteBtn)}</button>` : ""}
      </div>
      <p class="text-sm m-0" style="color:var(--ink-2)">${tr(I18N.degreeLabel)}: <b style="color:var(--ink)">${degreeOf(v.id)}</b></p>
      <p class="text-sm mt-1 m-0" style="color:var(--ink-2)">${tr(I18N.neighboursLabel)}: ${nbrs.length ? nbrs.join(", ") : "—"}</p>`;
    const delBtn = document.getElementById("delVertexBtn");
    if (delBtn) delBtn.onclick = () => { deleteVertex(v.id); selection = null; renderAll(); };
  } else {
    const e = edges.find(x => x.id === selection.id);
    if (!e) { selection = null; return renderSelectionCard(); }
    el.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <span class="math" style="font-size:18px;color:var(--accent);">${e.a}–${e.b}</span>
        ${editMode ? `<button id="delEdgeBtn" class="btn btn-ghost btn-sm">${tr(I18N.deleteBtn)}</button>` : ""}
      </div>
      ${stageIdx === 3 ? `<label class="field-label">${tr(I18N.weightLabel)}</label><input id="edgeWeightInput" class="field-input" type="number" min="1" step="1" value="${e.weight}">` : ""}`;
    const delBtn = document.getElementById("delEdgeBtn");
    if (delBtn) delBtn.onclick = () => { deleteEdge(e.id); selection = null; renderAll(); };
    const wIn = document.getElementById("edgeWeightInput");
    if (wIn) wIn.onchange = (ev) => { e.weight = Math.max(1, parseInt(ev.target.value) || 1); clearDerivedHighlights(); renderAll(); };
  }
}

function renderStatsCard() {
  const el = document.getElementById("statsCard");
  const n = vertices.length, m = edges.length;
  const { connected } = connectivityInfo();
  const tree = n > 0 && connected && m === n - 1;
  const yn = (b) => b ? tr(I18N.yes) : tr(I18N.no);
  el.innerHTML = `
    <div class="stat-row"><span>${tr(I18N.statVertices)}</span><b>${n}</b></div>
    <div class="stat-row"><span>${tr(I18N.statEdges)}</span><b>${m}</b></div>
    <div class="stat-row"><span>${tr(I18N.statConnected)}</span><b style="color:${n === 0 ? "var(--ink-3)" : connected ? "var(--ok)" : "var(--bad)"}">${n === 0 ? "—" : yn(connected)}</b></div>
    <div class="stat-row"><span>${tr(I18N.statIsTree)}</span><b style="color:${tree ? "var(--ok)" : "var(--ink-3)"}">${yn(tree)}</b></div>`;
}

function renderBasicsPanel() {
  const el = document.getElementById("basicsContent");
  if (vertices.length === 0) { el.innerHTML = `<p class="text-sm m-0" style="color:var(--ink-3)">${tr(I18N.basicsEmpty)}</p>`; return; }
  const rows = vertices.map(v => `<tr><td class="math" style="color:var(--accent);">${v.id}</td><td>${degreeOf(v.id)}</td><td style="font-size:12px;">${neighborsOf(v.id).sort().join(", ") || "—"}</td></tr>`).join("");
  const sumDeg = vertices.reduce((s, v) => s + degreeOf(v.id), 0);
  let matrixHtml;
  if (vertices.length <= 10) {
    const ids = vertices.map(v => v.id).sort();
    const head = "<tr><th></th>" + ids.map(id => `<th>${id}</th>`).join("") + "</tr>";
    const body = ids.map(r => "<tr><th>" + r + "</th>" + ids.map(c => r === c ? "<td>·</td>" : `<td>${edgesBetween(r, c) ? 1 : 0}</td>`).join("") + "</tr>").join("");
    matrixHtml = `<table class="adj-matrix mt-2">${head}${body}</table>`;
  } else {
    matrixHtml = `<p class="text-xs mt-2 m-0" style="color:var(--ink-3)">${tr(I18N.adjMatrixHidden)}</p>`;
  }
  const sumLine = tr({
    en: `Sum of degrees = <b>${sumDeg}</b> = 2 × ${edges.length} edges ${sumDeg === 2 * edges.length ? "✓" : ""}`,
    bm: `Jumlah darjah = <b>${sumDeg}</b> = 2 × ${edges.length} sisi ${sumDeg === 2 * edges.length ? "✓" : ""}`
  });
  el.innerHTML = `
    <table class="data-table"><thead><tr><th>${tr(I18N.colVertex)}</th><th>${tr(I18N.colDegree)}</th><th>${tr(I18N.colNeighbours)}</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="text-xs mt-3 m-0" style="color:var(--ink-2)">${sumLine}</p>
    <h4 class="eyebrow mt-4 mb-1">${tr(I18N.adjMatrixTitle)}</h4>
    ${matrixHtml}`;
}

function renderWalkPanel() {
  const el = document.getElementById("walkContent");
  const chips = walkSeq.map((id, i) => `<span class="chip">${id}</span>` + (i < walkSeq.length - 1 ? '<span style="color:var(--ink-3);padding:0 4px;">→</span>' : "")).join("");
  const cls = classifyWalk(walkSeq);
  const feedback = walkSeq.length < 2
    ? `<p class="text-xs m-0" style="color:var(--ink-3)">${tr(I18N.walkHint)}</p>`
    : `<div class="feedback ${cls.ok ? "ok" : "err"}">${cls.msg}</div>`;
  el.innerHTML = `
    <div class="mb-3" style="min-height:28px;">${chips || `<span class="text-xs" style="color:var(--ink-3)">${tr(I18N.walkNoRoute)}</span>`}</div>
    <div class="flex gap-2 mb-1">
      <button id="walkUndo" class="btn btn-ghost btn-sm">${tr(I18N.walkUndo)}</button>
      <button id="walkClear" class="btn btn-ghost btn-sm">${tr(I18N.walkClear)}</button>
    </div>
    ${feedback}
    <div class="mt-4 pt-3" style="border-top:1px solid var(--rule);font-size:12px;color:var(--ink-2);line-height:1.7;">
      <b style="color:var(--ink)">${tr(I18N.walkLegendWalk)}</b> — ${tr(I18N.walkLegendWalkDesc)}<br>
      <b style="color:var(--ink)">${tr(I18N.walkLegendTrail)}</b> — ${tr(I18N.walkLegendTrailDesc)}<br>
      <b style="color:var(--ink)">${tr(I18N.walkLegendPath)}</b> — ${tr(I18N.walkLegendPathDesc)}<br>
      <b style="color:var(--ink)">${tr(I18N.walkLegendCycle)}</b> — ${tr(I18N.walkLegendCycleDesc)}
    </div>`;
  document.getElementById("walkUndo").onclick = () => { walkSeq.pop(); renderAll(); };
  document.getElementById("walkClear").onclick = () => { walkSeq = []; renderAll(); };
}

function renderTreePanel() {
  const el = document.getElementById("treeContent");
  const check = treeCheck();
  el.innerHTML = `
    <div class="feedback ${check.isTree ? "ok" : "err"}">${check.msg}</div>
    <div class="flex gap-2 mt-3">
      <button id="spanBtn" class="btn btn-primary btn-sm" ${vertices.length === 0 ? "disabled" : ""}>${tr(I18N.spanBtn)}</button>
      ${spanningTreeHighlight ? `<button id="spanClearBtn" class="btn btn-ghost btn-sm">${tr(I18N.spanClearBtn)}</button>` : ""}
    </div>
    ${spanningTreeHighlight ? `<p class="text-xs mt-2 m-0" style="color:var(--ink-2)">${tr({
      en: `Highlighted ${spanningTreeHighlight.length} of ${edges.length} edges — a spanning tree touches all ${vertices.length} vertices using exactly ${vertices.length - 1} edges.`,
      bm: `Menyerlahkan ${spanningTreeHighlight.length} daripada ${edges.length} sisi — pokok rentang menyentuh kesemua ${vertices.length} bucu menggunakan tepat ${vertices.length - 1} sisi.`
    })}</p>` : ""}`;
  document.getElementById("spanBtn").onclick = () => { spanningTreeHighlight = computeSpanningTree(); renderAll(); };
  const clearBtn = document.getElementById("spanClearBtn");
  if (clearBtn) clearBtn.onclick = () => { spanningTreeHighlight = null; renderAll(); };
}

function renderWeightedPanel() {
  const controls = document.getElementById("weightedControls");
  if (vertices.length < 2) {
    controls.innerHTML = `<p class="text-sm m-0" style="color:var(--ink-3)">${tr(I18N.weightedAddTwo)}</p>`;
    document.getElementById("weightedResult").innerHTML = "";
    return;
  }
  const opts = vertices.map(v => `<option value="${v.id}">${v.id}</option>`).join("");
  controls.innerHTML = `
    <div class="flex gap-2">
      <div class="flex-1"><label class="field-label">${tr(I18N.startLabel)}</label><select id="startSelect" class="field-input">${opts}</select></div>
      <div class="flex-1"><label class="field-label">${tr(I18N.endLabel)}</label><select id="endSelect" class="field-input">${opts}</select></div>
    </div>
    <div class="flex gap-2 mt-3">
      <button id="findPathBtn" class="btn btn-primary btn-sm">${tr(I18N.findPathBtn)}</button>
      ${dijkstraAnim ? `<button id="skipAnimBtn" class="btn btn-ghost btn-sm">${tr(I18N.skipAnimBtn)}</button>` : ""}
    </div>`;
  const startSel = document.getElementById("startSelect"), endSel = document.getElementById("endSelect");
  if (selectedStart) startSel.value = selectedStart; else selectedStart = startSel.value;
  if (selectedEnd) endSel.value = selectedEnd; else { endSel.selectedIndex = Math.min(1, vertices.length - 1); selectedEnd = endSel.value; }
  startSel.onchange = (e) => { selectedStart = e.target.value; };
  endSel.onchange = (e) => { selectedEnd = e.target.value; };
  document.getElementById("findPathBtn").onclick = () => {
    selectedStart = startSel.value; selectedEnd = endSel.value;
    if (selectedStart === selectedEnd) return;
    runShortestPath(selectedStart, selectedEnd);
  };
  const skipBtn = document.getElementById("skipAnimBtn");
  if (skipBtn) skipBtn.onclick = () => {
    clearTimeout(dijkstraTimer);
    dijkstraAnim = null;
    const { dist, prev, steps } = dijkstra(selectedStart);
    finalizeShortestPathResult(selectedStart, selectedEnd, dist, prev, steps.map(s => s.finalized));
    renderAll();
  };

  const resultEl = document.getElementById("weightedResult");
  if (dijkstraAnim) {
    resultEl.innerHTML = `<p class="text-xs m-0" style="color:var(--ink-3)">${tr({ en: "Finalising vertex", bm: "Memuktamadkan bucu" })} <b class="math" style="color:var(--accent)">${dijkstraAnim.current || ""}</b>…</p>`;
  } else if (dijkstraResult) {
    if (dijkstraResult.unreachable) {
      resultEl.innerHTML = `<div class="feedback err">${tr({
        en: `No path exists between ${dijkstraResult.startId} and ${dijkstraResult.endId} — they are in different components.`,
        bm: `Tiada laluan wujud antara ${dijkstraResult.startId} dan ${dijkstraResult.endId} — kedua-duanya berada dalam komponen berlainan.`
      })}</div>`;
    } else {
      const rows = dijkstraResult.distTable.map(r => `<tr><td class="math" style="color:var(--accent);">${r.id}</td><td>${r.dist === Infinity ? "∞" : r.dist}</td><td>${r.via}</td></tr>`).join("");
      const summary = tr({
        en: `Shortest path: <b>${dijkstraResult.path.join(" → ")}</b> · total weight <b>${dijkstraResult.distance}</b>`,
        bm: `Laluan terpendek: <b>${dijkstraResult.path.join(" → ")}</b> · jumlah pemberat <b>${dijkstraResult.distance}</b>`
      });
      resultEl.innerHTML = `
        <div class="feedback ok">${summary}</div>
        <table class="data-table mt-3"><thead><tr><th>${tr(I18N.colVertex)}</th><th>${tr(I18N.colDistance)}</th><th>${tr(I18N.colVia)}</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
  } else {
    resultEl.innerHTML = "";
  }
}

function renderPanels() {
  document.getElementById("basicsPanel").style.display = stageIdx === 0 ? "" : "none";
  document.getElementById("walkPanel").style.display = stageIdx === 1 ? "" : "none";
  document.getElementById("treePanel").style.display = stageIdx === 2 ? "" : "none";
  document.getElementById("weightedPanel").style.display = stageIdx === 3 ? "" : "none";
  if (stageIdx === 0) renderBasicsPanel();
  if (stageIdx === 1) renderWalkPanel();
  if (stageIdx === 2) renderTreePanel();
  if (stageIdx === 3) renderWeightedPanel();
}

function renderTerms() {
  document.getElementById("termsList").innerHTML = TERMS.map(t => `<div class="term-row"><div class="term-name">${tr(t.t)}</div><div class="term-desc">${tr(t.d)}</div></div>`).join("");
}

function renderAll() {
  renderStaticLabels();
  renderRail();
  renderHeader();
  renderGraphSVG();
  renderPanels();
  renderSelectionCard();
  renderStatsCard();
  renderEditToggleUI();
  renderTerms();
}

// ===== STAGE / CONTROLS =====
function setStage(i) {
  stageIdx = clamp(i, 0, 3);
  walkSeq = []; pendingConnectFrom = null; selection = null;
  clearDerivedHighlights();
  renderAll();
}
document.getElementById("prevBtn").addEventListener("click", () => setStage(stageIdx - 1));
document.getElementById("nextBtn").addEventListener("click", () => setStage(stageIdx + 1));

document.getElementById("editToggle").addEventListener("click", () => {
  editMode = !editMode;
  pendingConnectFrom = null; selection = null;
  renderAll();
});

document.getElementById("newGraphBtn").addEventListener("click", () => {
  vertices = []; edges = [];
  resetTransientState();
  renderAll();
});

const presetSelect = document.getElementById("presetSelect");
presetSelect.addEventListener("change", (e) => loadPreset(e.target.value));

// ===== THEME =====
function applyTheme() {
  if (isDark) document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme");
  document.getElementById("themeToggle").textContent = isDark ? tr(I18N.themeLight) : tr(I18N.themeDark);
  try { localStorage.setItem("graphtheory-theme", isDark ? "dark" : "light"); } catch (e) {}
}
document.getElementById("themeToggle").addEventListener("click", () => { isDark = !isDark; applyTheme(); });

// ===== LANGUAGE TOGGLE =====
function applyLang() {
  document.documentElement.lang = LANG === "bm" ? "ms" : "en";
  document.getElementById("langToggle").textContent = LANG === "bm" ? "EN" : "BM";
  try { localStorage.setItem("graphtheory-lang", LANG); } catch (e) {}
  applyTheme();
  renderAll();
}
document.getElementById("langToggle").addEventListener("click", () => { LANG = LANG === "bm" ? "en" : "bm"; applyLang(); });

// ===== INIT =====
(function initLang() {
  let saved = null;
  try { saved = localStorage.getItem("graphtheory-lang"); } catch (e) {}
  LANG = saved === "bm" ? "bm" : "en";
  document.documentElement.lang = LANG === "bm" ? "ms" : "en";
  document.getElementById("langToggle").textContent = LANG === "bm" ? "EN" : "BM";
})();
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("graphtheory-theme"); } catch (e) {}
  const sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  isDark = (saved || sys) === "dark";
  applyTheme();
})();
presetSelect.value = "demo";
loadPreset("demo");
setStage(0);
</script>
</body>
</html>
